# Render video — GitHub Actions (test)
#
# Renders one or two Remotion compositions on GitHub-hosted runners
# (ubuntu-latest, 4 vCPU, 16 GB RAM) instead of the VM.
# Trigger: Actions tab → "Render video" → Run workflow.
#
# Inputs:
#   videos      — v7-both (default) renders EN + DE in parallel (matrix, 2 runners),
#                 v7-en-only / v7-de-only render a single composition.
#   clips       — committed (default): use the pre-converted clips in the repo.
#                 download: fetch sources from scripts/clips-v7.json and
#                 pre-convert them (yt-dlp + ffmpeg minterpolate).
#   generate_vo — false (default): use the committed VO mp3 in public/batch6/v7-*/.
#                 true: regenerate the VO with Kokoro in CI (downloads ~1.5 GB
#                 of pip packages + models on first run, cached afterwards).
#
# Outputs: one mp4 artifact per composition (retention 7 days — download it
# quickly: the free plan only includes 500 MB of shared artifact storage).
# Run scripts/preflight.sh on the downloaded mp4 back on the VM before presenting.
name: Render video

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'Which video(s) to render'
        required: true
        default: v7-both
        type: choice
        options:
          - v7-both
          - v7-en-only
          - v7-de-only
      clips:
        description: 'Clip assets: committed (repo) or download (from sources)'
        required: true
        default: committed
        type: choice
        options:
          - committed
          - download
      generate_vo:
        description: 'Regenerate the voiceover with Kokoro in CI (else use committed VO)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  setup:
    name: Choose compositions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix from input
        id: set-matrix
        run: |
          case "${{ inputs.videos }}" in
            v7-en-only) echo 'matrix={"composition":["AntikytheraVideoEn"]}' >> "$GITHUB_OUTPUT" ;;
            v7-de-only) echo 'matrix={"composition":["AntikytheraVideoDe"]}' >> "$GITHUB_OUTPUT" ;;
            *)          echo 'matrix={"composition":["AntikytheraVideoEn","AntikytheraVideoDe"]}' >> "$GITHUB_OUTPUT" ;;
          esac

  render:
    name: Render ${{ matrix.composition }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng python3-numpy
          # python3-numpy is required by scripts/preflight.sh (dup-frame check).
          mkdir -p ~/.fonts
          cp assets/fonts/*.ttf ~/.fonts/
          # Anton is the subtitle fallback font (not shipped in the repo)
          curl -fsSL -o ~/.fonts/Anton-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf
          fc-cache -f
          fc-list | grep -i -E "titan|monoton|anton" || (echo "FONTS MISSING" && exit 1)

      - name: Install Remotion browser
        run: npx remotion browser install

      - name: Download clips from sources
        if: inputs.clips == 'download'
        run: bash scripts/download-clips-v7.sh

      - name: Setup Python 3.12 (Kokoro VO)
        if: inputs.generate_vo
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Kokoro stack
        if: inputs.generate_vo
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          # Torch CPU (~800 MB) from the PyTorch CPU index.
          .venv/bin/pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install --quiet -r requirements-ci.txt
          .venv/bin/python -c "import torch, kokoro, misaki; print('kokoro stack OK')"

      - name: Restore Kokoro models from cache
        if: inputs.generate_vo
        uses: actions/cache@v4
        with:
          path: |
            kokoro-test/kokoro-v1.0.onnx
            kokoro-test/voices-v1.0.bin
            kokoro-test/kikiri_german_martin_ep10_converted.pth
            kokoro-test/martin.pt
            kokoro-test/config.json
          key: kokoro-models-v1

      - name: Download Kokoro models if missing
        if: inputs.generate_vo
        run: |
          mkdir -p kokoro-test
          cd kokoro-test
          [ -f kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          [ -f kikiri_german_martin_ep10.pth ] || curl -fsSL -L -o kikiri_german_martin_ep10.pth \
            "https://huggingface.co/kikiri-tts/kikiri-german-martin/resolve/main/kikiri_german_martin_ep10.pth"
          [ -f martin.pt ] || curl -fsSL -L -o martin.pt \
            "https://huggingface.co/kikiri-tts/kikiri-german-martin/resolve/main/voices/martin.pt"
          [ -f config.json ] || curl -fsSL -o config.json \
            https://huggingface.co/hexgrad/Kokoro-82M/resolve/main/config.json
          # SHA-256 checks (LFS hashes verified on the VM, 2026-11-09).
          echo "f194905cc97d4ef16e0f2613c2d277203e0c0f0f533e0a468c7ec76c566259dc  kikiri_german_martin_ep10.pth" | sha256sum -c -
          echo "dc2e245e631ceaa9d30b327dac076342649c62f953021bcccafbe254ee43e553  martin.pt" | sha256sum -c -
          # Convert the kikiri checkpoint to the kokoro 0.9.4 weight format (VM bug fix, 2026-11-09).
          if [ ! -f kikiri_german_martin_ep10_converted.pth ]; then
            ../.venv/bin/python convert_kikiri.py
          fi
          ls -la kokoro-v1.0.onnx voices-v1.0.bin kikiri_german_martin_ep10_converted.pth martin.pt config.json

      - name: Generate VO (Kokoro) and replace committed VO
        if: inputs.generate_vo
        run: |
          # EN: bm_george 1.15 — DE: martin 1.3 (1.15 is too slow in German: 93.9 s).
          # The component reads public/batch6/v7-en/v7-vo-en.mp3 or v7-de/v7-vo-de-mix.mp3.
          if [ "${{ matrix.composition }}" = "AntikytheraVideoEn" ]; then
            ./speak-kokoro.sh en @public/batch6/v7-en/v7-script-en.txt bm_george 1.15 public/batch6/v7-en/v7-vo-en.mp3
          else
            ./speak-kokoro.sh de @public/batch6/v7-de/v7-vo-de.txt martin 1.3 public/batch6/v7-de/v7-vo-de.mp3
            # DE component uses the VO+music mix; without music, copy the plain VO over the mix.
            cp public/batch6/v7-de/v7-vo-de.mp3 public/batch6/v7-de/v7-vo-de-mix.mp3
          fi

      - name: Render
        run: |
          mkdir -p out
          npx remotion render "${{ matrix.composition }}" "out/${{ matrix.composition }}.mp4"
          ls -la out/

      - name: Preflight check
        run: bash scripts/preflight.sh "out/${{ matrix.composition }}.mp4" 30 1080x1920

      - name: Extract verification frames
        run: |
          mkdir -p out/frames
          for t in 2 25 50 62 70 79; do
            ffmpeg -y -v error -ss "$t" -i "out/${{ matrix.composition }}.mp4" -frames:v 1 "out/frames/f${t}.jpg"
          done
          ls -la out/frames/

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.composition }}
          path: out/${{ matrix.composition }}.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Upload verification frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.composition }}
          path: out/frames/
          retention-days: 7
          if-no-files-found: error
